name: Release

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the tested main revision to PyPI and GitHub Releases
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/ci.yaml
  publish:
    if: github.ref == 'refs/heads/main' && inputs.publish
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: distributions
          path: dist/
      - name: Publish tested artifacts using PyPI trusted publishing
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
  github-release:
    if: github.ref == 'refs/heads/main' && inputs.publish
    needs: [validate, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: pypi
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: distributions
          path: dist/
      - name: Publish matching GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: v${{ needs.validate.outputs.version }}
          RELEASE_SHA: ${{ github.sha }}
        run: gh release create "$RELEASE_TAG" dist/* --target "$RELEASE_SHA" --title "$RELEASE_TAG" --generate-notes
