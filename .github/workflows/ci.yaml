name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:
  workflow_call:
    outputs:
      version:
        description: Version of the tested distribution
        value: ${{ jobs.distribution.outputs.version }}

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Unit (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ['3.10', '3.11', '3.12']
        include:
          - os: windows-latest
            python: '3.12'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install package and portable test dependencies
        run: |
          python -m pip install pip==26.2.1
          python -m pip install pytest==9.1.1 packaging==26.3 ruff==0.16.0
          python -m pip install --no-deps .
          python .github/scripts/install_ci_dependencies.py
      - name: Lint package, tests, and CI helpers
        run: python -m ruff check stormhub tests .github/scripts --extend-select E9,F63,F7,F82
      - name: Check formatting of the security boundary and new regressions
        run: python -m ruff format --check stormhub/server/serve.py tests/test_preview_server.py tests/test_requests_security.py .github/scripts/install_ci_dependencies.py
      - name: Check installed wheel imports and schema assets
        run: python -I -c "import stormhub.publishing, stormhub.server.serve; from importlib.resources import files; assert list(files('stormhub.scenarios').joinpath('schemas').iterdir())"
      - name: Run portable contracts and security regressions
        run: >-
          python -I -m pytest -q
          tests/test_authenticated_publisher.py tests/test_preview_server.py
          tests/test_requests_security.py tests/test_scenario_contract.py
          tests/test_scenario_publisher.py tests/test_scenario_response.py
          tests/test_scenario_stac.py
      - name: Record resolved test dependencies
        run: python -m pip freeze --all
  distribution:
    name: Build tested distribution
    needs: unit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - run: python -m pip install pip==26.2.1
      - run: python -m pip install build==1.6.1
      - run: python -m build
      - name: Read distribution version
        id: version
        run: |
          python -m pip install --no-deps dist/*.whl
          python -c "from importlib.metadata import version; print('version=' + version('stormhub'))" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: distributions
          path: dist/
          if-no-files-found: error
          retention-days: 14
